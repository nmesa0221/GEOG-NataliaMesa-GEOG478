<!DOCTYPE html>
<html>
<head>
  <title>Natalia's First Web Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    html, body, #map {
      height: 100%;
      width: 100vw;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
  var map = L.map('map').fitWorld();
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  map.locate({setView: true, maxZoom: 16});

  function onLocationFound(e) {
    var radius = e.accuracy;
    L.marker(e.latlng).addTo(map)
      .bindPopup("You are within " + radius + " meters from this point").openPopup();
    L.circle(e.latlng, radius).addTo(map);
  }

  function onLocationError(e) {
    alert(e.message);
  }

  map.on('locationfound', onLocationFound);
  map.on('locationerror', onLocationError);

  var kyleField = [30.6084, -96.3402];
  L.circle(kyleField, {
    color: 'blue',
    fillColor: '#30f',
    fillOpacity: 0.4,
    radius: 300
  }).addTo(map).bindPopup("Kyle Field");

  var omBuilding = [30.6179, -96.3386];
  var academicBuilding = [30.6159, -96.3413];

  L.marker(omBuilding).addTo(map)
    .bindPopup("O&M Building");

  L.marker(academicBuilding).addTo(map)
    .bindPopup("Academic Building");

  var popup = L.popup();

  map.on('click', function(e) {
    popup
      .setLatLng(e.latlng)
      .setContent("Coordinates: " + e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5))
      .openOn(map);
  });
</script>

</body>
</html>
