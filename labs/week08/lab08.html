<!DOCTYPE html>
<html>
  <head>
    <title>Lab 8 Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.6/esri/css/main.css">
    <script src="https://js.arcgis.com/4.6/"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }

      #viewDiv {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="viewDiv"></div>

    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/FeatureLayer",
        "dojo/domReady!"
      ], function(Map, MapView, FeatureLayer) {

        var map = new Map({
          basemap: "streets"
        });

        var view = new MapView({
          container: "viewDiv",
          map: map,
          center: [-96.3395, 30.6175], // TAMU campus
          zoom: 17
        });

        var featureLayer = new FeatureLayer({
          url: "https://services1.arcgis.com/qr14biwnHA6Vis6l/arcgis/rest/services/Lab08MSCshp/FeatureServer",
          popupTemplate: {
            title: "{Name}",
            actions: [{
              id: "find",
              title: "Find Nearby",
              className: "esri-icon-search"
            }],
            content: [{
              type: "fields",
              fieldInfos: [
                { fieldName: "Name", label: "Name" },
                { fieldName: "Abbr", label: "Abbreviation" }
              ]
            }]
          }
        });

        map.add(featureLayer);
      });
    </script>
  </body>
</html>
